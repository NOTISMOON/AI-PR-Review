# ReviewForge 单容器负载均衡入口（监听 3000，对外唯一入口，HTTPS）
# 内网穿透 frp(ChmlFrp)：公网 https://aiprreview.notismoon.top -> frp 服务器 443 -> 本机 3000(SSL 终止) -> 轮询分发到 3001/3002/3003 的 Next 多实例
user root;
worker_processes 1;
# 容器内由 PM2 托管、无 tty，/dev/stderr 不可用，错误日志改用普通文件
error_log /tmp/nginx-error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log off;

    upstream review_web {
        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
        server 127.0.0.1:3003;
    }

    server {
        listen 3000 ssl;
        http2 on;

        # SSL 证书（镜像内由 Dockerfile 复制到 /etc/nginx/ssl/）
        ssl_certificate     /etc/nginx/ssl/aiprreview.notismoon.top_bundle.pem;
        ssl_certificate_key /etc/nginx/ssl/aiprreview.notismoon.top.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        server_name aiprreview.notismoon.top localhost xg-2.frp.one;

        # SSE（通知实时推送）与长连接必需：关闭缓冲，升级 HTTP/1.1
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
        # 透传内网穿透域名，供后端用 X-Forwarded-Host 生成可访问的 webhook 回调地址
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location / {
            proxy_pass http://review_web;
        }
    }
}